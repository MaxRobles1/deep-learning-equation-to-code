[project]
name = "deep-learning-equation-to-code"
version = "0.1.0"
description = "Open deep learning course: from intuition to equations, and from equations to code."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT" # code; written content is CC BY 4.0 (see LICENSE-CONTENT)
authors = [{ name = "Maximino Jiménez Robles" }]
dependencies = [
    "numpy>=2.5",
    "pandas>=3.1",
    "matplotlib>=3.11",
    "scikit-learn>=1.9",
    "torch>=2.11",
    "torchvision>=0.26",
    "tensorboard>=2.21",
    "jupyterlab>=4.6",
    "ipywidgets>=8.1",
]

[dependency-groups]
dev = [
    "ruff==0.17.5", # same version as the pre-commit hook
    "pytest",
    "nbmake",
    "pre-commit",
    "nbstripout",
    "detect-secrets",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dl_course"]

# CPU-only PyTorch on Linux (CI); macOS uses the default wheels (Apple Silicon GPU via MPS).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "NPY", "RUF", "T20"]
# Math notation: matrices and tensors are uppercase (X, W), as in docs/NOTATION.md.
ignore = ["N803", "N806"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["T20", "E501"] # lessons print results and may show long formulas
"tests/*" = ["T20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
